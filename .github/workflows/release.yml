name: Draft candidate release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25.0.4'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify candidate
        run: ./gradlew clean build --warning-mode all

      - name: Export canonical release metadata
        run: ./gradlew -q printReleaseMetadata > build/release-metadata.env

      - name: Create checksum
        run: |
          source build/release-metadata.env
          cd build/libs
          sha256sum "${artifactName}" > SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source build/release-metadata.env
          gh release create "v${version}" \
            "build/libs/${artifactName}" \
            build/libs/SHA256SUMS \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "1MB AntiPopup ${version}"
