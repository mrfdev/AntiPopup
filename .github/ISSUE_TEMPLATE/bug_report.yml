name: Bug report
title: "[BUG] "
description: Create a report to help us improve
labels: bug
assignees: []

body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: Operating System
      description: What operating system are you using?
      placeholder: Arch Linux
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Server Software
      description: Which Paper 26.2 build are you using?
      placeholder: Paste the complete Paper version, build number, and commit identifier.
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java Version
      description: Include the complete output of java -version.
      placeholder: Paste the complete java -version output.
    validations:
      required: true
  - type: input
    id: antipopup
    attributes:
      label: AntiPopup Version
      description: Include the plugin version and jar filename.
      placeholder: Copy the AntiPopup release metadata line from the startup log.
    validations:
      required: true
  - type: dropdown
    id: ver
    attributes:
      label: Server Version
      description: What minecraft version is your server using?
      options:
        - "26.2"
    validations:
      required: true
  - type: textarea
    id: clients
    attributes:
      label: Native Client Version
      description: Include the exact official Minecraft client version used for the join test. Protocol translators are unsupported.
      placeholder: Minecraft 26.2
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Plugin List
      description: What plugins are on your server?
      placeholder: AntiPopup, LuckPerms
      render: bash
    validations:
      required: true
  - type: input
    id: logs
    attributes:
      label: Server logs
      description: Paste a link to the complete relevant log after removing credentials, tokens, private IPs or addresses, and other private values.
    validations:
      required: true
